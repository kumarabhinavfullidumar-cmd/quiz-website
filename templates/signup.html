<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | GK Quiz</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #061b48, #168cff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .signup-box {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #061b48;
            margin-bottom: 8px;
        }

        .logo span {
            color: #168cff;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        h2 {
            text-align: center;
            color: #182235;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 17px;
            border: 1px solid #d7deea;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #168cff;
            box-shadow: 0 0 0 3px rgba(22, 140, 255, 0.1);
        }

        .signup-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #168cff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .signup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(22, 140, 255, 0.25);
        }

        .login-text {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
        }

        .login-text a {
            color: #168cff;
            font-weight: bold;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="signup-box">

        <div class="logo">
            💡 GK <span>Quiz</span>
        </div>

        <p class="subtitle">
            Create your account and start learning
        </p>

        <h2>📝 Create Account</h2>

        <form>

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                maxlength="50"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="dob">Date of Birth</label>
            <input
                type="date"
                id="dob"
                required
            >

            <button type="submit" class="signup-btn">
                Continue with Email
            </button>

        </form>

        <p class="login-text">
            Already have an account?
            <a href="/login">Login</a>
        </p>

    </div>

</body>
</html>
