<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GK Quiz</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #061b48, #168cff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #061b48;
            margin-bottom: 8px;
        }

        .logo span {
            color: #168cff;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 28px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #182235;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #d7deea;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #168cff;
            box-shadow: 0 0 0 3px rgba(22, 140, 255, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #168cff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .otp-box {
            display: none;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .signup-text {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
        }

        .signup-text a {
            color: #168cff;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        💡 GK <span>Quiz</span>
    </div>

    <p class="subtitle">
        Learn • Play • Improve
    </p>

    <h2>🔐 Login</h2>

    <form id="loginForm">

        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <button type="submit" class="login-btn">
            Send OTP
        </button>

    </form>

    <div class="otp-box" id="otpBox">

        <label for="otp">Enter OTP</label>

        <input
            type="text"
            id="otp"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
        >

        <button onclick="verifyOTP()" class="login-btn">
            Verify OTP
        </button>

    </div>

    <p id="message" class="message"></p>

    <p class="signup-text">
        Don't have an account?
        <a href="/signup">Create Account</a>
    </p>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value;
    const message = document.getElementById("message");

    const response = await fetch("/api/send-otp", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            email: email
        })
    });

    const data = await response.json();

    if (response.ok) {

        document.getElementById("otpBox").style.display = "block";

        message.innerText = "✅ OTP sent to your email";

    } else {

        message.innerText = "❌ " + data.error;

    }

});


async function verifyOTP() {

    const email = document.getElementById("email").value;
    const otp = document.getElementById("otp").value;
    const message = document.getElementById("message");

    const response = await fetch("/api/verify-otp", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            email: email,
            otp: otp
        })
    });

    const data = await response.json();

    if (response.ok) {

        message.innerText = "✅ Login successful!";

        setTimeout(function() {
            window.location.href = "/";
        }, 1000);

    } else {

        message.innerText = "❌ " + data.error;

    }

}

</script>

</body>
</html>
