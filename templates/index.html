<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Quiz 🧠</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .quiz-box {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            font-size: 32px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        #timer,
        #score {
            margin: 0;
            padding: 10px 14px;
            border-radius: 12px;
            background: #f1f3f6;
            font-weight: bold;
        }

        #question {
            font-size: 23px;
            line-height: 1.4;
            margin: 25px 0;
        }

        #options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #options button {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e1e1;
            border-radius: 14px;
            background: white;
            cursor: pointer;
            font-size: 17px;
            text-align: left;
            transition: 0.2s;
        }

        #options button:hover {
            transform: translateY(-2px);
            background: #f4f4ff;
            border-color: #667eea;
        }

        #next {
            width: 100%;
            padding: 15px;
            margin-top: 22px;
            border: none;
            border-radius: 14px;
            background: #222;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        #next:hover {
            background: #444;
        }

        .result {
            text-align: center;
        }

        .result h2 {
            font-size: 28px;
        }

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .quiz-box {
                padding: 20px;
                border-radius: 18px;
            }

            h1 {
                font-size: 26px;
            }

            #question {
                font-size: 20px;
            }

            #options button {
                font-size: 16px;
                padding: 14px;
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }

            #timer,
            #score {
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="quiz-box">

    <h1>🧠 My Quiz</h1>

<input
    id="playerName"
    type="text"
    placeholder="अपना नाम लिखें"
    maxlength="30"
>

    <div class="top-bar">
        <p id="timer">⏱️ Time: 15</p>
        <p id="score">🏆 Score: 0</p>
    </div>

    <h2 id="question">Question loading...</h2>

    <div id="options"></div>

    <button id="next" onclick="nextQuestion()">
        Next Question ➡️
    </button>

</div>


<script>

let questions = [];
let currentQuestion = 0;
let score = 0;

let timeLeft = 15;
let timer;


async function loadQuiz() {

    let response = await fetch("/api/questions");

    questions = await response.json();

    showQuestion();
}


function showQuestion() {

    clearInterval(timer);

    timeLeft = 15;

    document.getElementById("timer").innerText =
        "⏱️ Time: " + timeLeft;


    let q = questions[currentQuestion];

    document.getElementById("question").innerText =
        q.question;


    let options =
        document.getElementById("options");

    options.innerHTML = "";


    q.options.forEach(function(option) {

        let button =
            document.createElement("button");

        button.innerText = option;


        button.onclick = function() {

            checkAnswer(option);

        };


        options.appendChild(button);

    });


    timer = setInterval(function() {

        timeLeft--;

        document.getElementById("timer").innerText =
            "⏱️ Time: " + timeLeft;


        if (timeLeft <= 0) {

            clearInterval(timer);

            alert("⏰ Time Up!");

        }

    }, 1000);
}


function checkAnswer(answer) {

    clearInterval(timer);


    if (answer === questions[currentQuestion].answer) {

        score++;

        alert("✅ सही जवाब!");

    } else {

        alert("❌ गलत जवाब!");

    }


    document.getElementById("score").innerText =
        "🏆 Score: " + score;
}

async function saveScore() {

    let name = document.getElementById("playerName").value.trim();

    if (name === "") {
        name = "Anonymous";
    }

    await fetch("/api/scores", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: name,
            score: score
        })
    });
}

function nextQuestion() {

    currentQuestion++;


    if (currentQuestion < questions.length) {

        showQuestion();

    } else {

        saveScore();
         
    async function showLeaderboard() {

    let response = await fetch("/api/scores");

    let scores = await response.json();

    let leaderboard = "<h2>🏆 Leaderboard</h2>";

    if (scores.length === 0) {
        leaderboard += "<p>अभी कोई score नहीं है।</p>";
    } else {
        scores.forEach(function(item, index) {

            leaderboard +=
                "<p>" +
                (index + 1) +
                ". " +
                item.name +
                " — " +
                item.score +
                "</p>";
        });
    }

    document.getElementById("options").innerHTML =
        leaderboard;
}
        document.getElementById("question").innerText =
            "🎉 Quiz Complete!";

        document.getElementById("options").innerHTML =
            "<div class='result'>" +
            "<h2>🏆 Final Score</h2>" +
            "<h2>" +
            score +
            "/" +
            questions.length +
            "</h2>" +
            "</div>";

        document.getElementById("next").style.display =
            "none";

        showLeaderboard();
    }
}


loadQuiz();

</script>

</body>
</html>
